<!doctype html>
<!--
  Layout probe.

  Renders a real CV through the REAL src/lib/cv-layout.ts engine inside a real
  browser, so block heights, font metrics and line breaking are the genuine
  article. Run it with `node scripts/run-layout-probe.mjs`; it prints a JSON
  page-by-page report used to judge pagination quality.

  The document below is Ana Petrova's CV as exported to Ana_Petrova_CV.pdf,
  rendered with the Modern template's exact geometry. It is the reproduction
  case for the "poor page transition" report.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CV layout probe</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; font-family: Arial, sans-serif; }
      .cv-flow { display: flow-root; }
      .cv-measure { position: fixed; top: 0; left: -100000px; opacity: 0; pointer-events: none; }
      pre { font: 12px/1.4 monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <pre id="report">pending</pre>
    <div class="cv-measure" id="stage"></div>
    <script type="module">
      import { paginate } from '/probe-entry.js'

      /* ------------------------- Modern template (modern.tsx) -------------------- */
      const PAGE_W = 794
      const PAGE_H = 1123
      const PAD = { top: 46, right: 54, bottom: 44, left: 54 }
      const CONTENT_W = PAGE_W - PAD.left - PAD.right // 686
      const CONTENT_H = PAGE_H - PAD.top - PAD.bottom // 1033

      const ACCENT = '#1F4E79'
      const INK = '#11161F'
      const BODY = '#39404D'
      const MUTED = '#6B7280'
      const FAINT = '#989FA9'
      const SANS = 'Arial, "Helvetica Neue", Helvetica, "Segoe UI", sans-serif'
      const withAlpha = (hex, a) => {
        const c = hex.replace('#', '')
        return `rgba(${parseInt(c.slice(0, 2), 16)}, ${parseInt(c.slice(2, 4), 16)}, ${parseInt(c.slice(4, 6), 16)}, ${a})`
      }

      function el(style, text) {
        const node = document.createElement('div')
        for (const [key, value] of Object.entries(style)) node.style[key] = value
        if (text !== undefined) node.textContent = text
        return node
      }
      function span(style, text) {
        const node = document.createElement('span')
        for (const [key, value] of Object.entries(style)) node.style[key] = value
        if (text !== undefined) node.textContent = text
        return node
      }
      function para(style, text) {
        const node = document.createElement('p')
        for (const [key, value] of Object.entries(style)) node.style[key] = value
        const inner = document.createElement('span')
        inner.setAttribute('data-cv-text', '')
        inner.textContent = text
        node.appendChild(inner)
        return node
      }
      const joined = (parts, sep = ' · ') =>
        parts.map((p) => (p ?? '').trim()).filter(Boolean).join(sep)
      const clean = (text) => (text ?? '').replace(/\s*\n+\s*/g, ' ').trim()

      const ENTRY_BOTTOM = 9
      const ITEM_BOTTOM = 6
      const PARAGRAPH = { fontSize: '13px', lineHeight: '1.6', color: BODY }
      const flexRow = (extra) => ({ display: 'flex', alignItems: 'center', ...extra })

      function headingNode(label) {
        const row = el(flexRow({ gap: '12px', margin: '17px 0 9px' }))
        row.appendChild(span({ fontSize: '12px', fontWeight: '700', letterSpacing: '0.15em', color: ACCENT }, label))
        row.appendChild(el({ flex: '1', height: '2px', background: withAlpha(ACCENT, 0.22) }))
        return row
      }
      function entryNode({ title, sub, date }) {
        const row = el({ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '14px' })
        const left = el({ flex: '1' })
        left.appendChild(el({ fontSize: '14.5px', fontWeight: '700', color: INK, lineHeight: '1.25' }, title))
        if (sub) left.appendChild(el({ fontSize: '12.5px', color: MUTED, marginTop: '2px', lineHeight: '1.3' }, sub))
        row.appendChild(left)
        if (date) {
          row.appendChild(
            el({ fontSize: '11.5px', color: MUTED, fontWeight: '600', letterSpacing: '0.02em', whiteSpace: 'nowrap' }, date),
          )
        }
        return row
      }
      function bulletNode(text) {
        const row = el({
          display: 'flex',
          gap: '9px',
          fontSize: '13px',
          lineHeight: '1.55',
          color: BODY,
          marginBottom: '4px',
        })
        row.appendChild(
          el({ width: '4px', height: '4px', marginTop: '8px', background: ACCENT, flex: 'none', borderRadius: '1px' }),
        )
        row.appendChild(span({ flex: '1' }, text))
        return row
      }
      function badgesNode(category, items) {
        const wrap = document.createElement('div')
        if (category && category !== 'Core Skills') {
          wrap.appendChild(el({ fontSize: '11.5px', fontWeight: '700', color: MUTED, marginBottom: '5px' }, category))
        }
        const row = el({ display: 'flex', flexWrap: 'wrap', gap: '6px' })
        for (const item of items) {
          row.appendChild(
            span(
              {
                fontSize: '11.5px',
                color: ACCENT,
                background: withAlpha(ACCENT, 0.08),
                border: `1px solid ${withAlpha(ACCENT, 0.2)}`,
                padding: '2px 9px',
                borderRadius: '999px',
              },
              item,
            ),
          )
        }
        wrap.appendChild(row)
        return wrap
      }
      function languageNode(name, level) {
        const row = el({ fontSize: '13px', color: BODY, display: 'flex', gap: '8px', marginBottom: '4px' })
        row.appendChild(span({ fontWeight: '700', color: INK }, name))
        if (level) row.appendChild(span({ color: MUTED }, level))
        return row
      }
      function simpleEntryNode({ title, sub, date }) {
        const row = el({ display: 'flex', justifyContent: 'space-between', gap: '14px', alignItems: 'baseline' })
        const left = el({ flex: '1' })
        left.appendChild(span({ fontSize: '13.5px', fontWeight: '700', color: INK }, title))
        if (sub) left.appendChild(span({ fontSize: '12.5px', color: MUTED }, ` — ${sub}`))
        row.appendChild(left)
        if (date) row.appendChild(span({ fontSize: '11.5px', color: FAINT, whiteSpace: 'nowrap' }, date))
        return row
      }
      function headerNode() {
        const band = el({
          marginTop: `-${PAD.top}px`,
          marginLeft: `-${PAD.left}px`,
          marginRight: `-${PAD.right}px`,
          marginBottom: '6px',
          background: ACCENT,
          color: '#FFFFFF',
          padding: `42px ${PAD.left}px 26px`,
        })
        band.appendChild(
          el(
            { fontSize: '33px', fontWeight: '700', lineHeight: '1.08', letterSpacing: '-0.015em', marginTop: '18px' },
            DATA.fullName,
          ),
        )
        band.appendChild(
          el(
            {
              fontSize: '14px',
              marginTop: '8px',
              color: 'rgba(255,255,255,0.9)',
              letterSpacing: '0.09em',
              textTransform: 'uppercase',
              fontWeight: '600',
            },
            DATA.title,
          ),
        )
        return band
      }
      const spacerNode = (height) => el({ height: `${height}px` })
      const entryParts = (title, sub, date) => {
        const t = (title ?? '').trim()
        const s = (sub ?? '').trim()
        return { title: t || s, sub: t ? s : '', date: (date ?? '').trim() }
      }

      const DATA = {
        fullName: 'Ana Petrova',
        title: 'Licensed Clinical Social Worker & Human-AI Interaction Specialist',
        summary:
          'Ana is a licensed clinical social worker with more than five years of direct client practice and deep experience in qualitative research and human-computer interaction. She elicits missing context from diverse populations, synthesizes social, psychological, and practical factors to shape personalized recommendations. Recent work involved designing and running AI evaluation pilots that test language model alignment with user context. She pairs analytical rigor with empathetic communication, delivering clear feedback and actionable insights. Fluent in English and comfortable collaborating across Latin America, Southeast Europe, Asia, and Africa.',
        experience: [
          {
            id: 'e1',
            role: 'Text Situated Alignment Specialist — BA (Contract)',
            company: 'Turing AI Labs',
            location: 'Sofia, Bulgaria',
            date: '2023-09 – Present',
            bullets: [
              'Worked with AI research engineers to create evaluation scenarios that add social context before user requests, raising model relevance 27%.',
              'Assessed language model responses for relevance, usefulness, personalization, clarity and alignment, reaching 92% inter-rater reliability.',
              'Wrote detailed feedback that explained rating rationale, cutting ambiguity in later model fine-tuning cycles.',
              'Led weekly debriefs with multidisciplinary teams, refining project guidelines and keeping the timeline on track.',
              'Synthesized qualitative coding of model interactions, spotting key context cues that lifted recommendation accuracy 18%.',
              'Built a structured case review workflow, slashing data entry time 35% while preserving documentation standards.',
            ],
          },
          {
            id: 'e2',
            role: 'Licensed Clinical Social Worker',
            company: 'Global Health Services',
            location: 'Sofia, Bulgaria',
            date: '2020-06 – 2023-08',
            bullets: [
              'Delivered individual counseling to more than 350 clients, achieving a 94% satisfaction rating.',
              'Elicited missing context in intake interviews, boosting treatment planning completeness 22%.',
              'Authored case notes with structured qualitative coding, enabling cross-team analysis of psychosocial factors.',
              'Ran multidisciplinary case conferences that wove biological, psychological, social and spiritual dimensions together.',
              'Implemented a resource-mapping tool, linking 78 clients to financial and educational support services.',
              'Mentored junior social workers in client-centered communication, lifting team productivity 15%.',
            ],
          },
          {
            id: 'e3',
            role: 'Qualitative Researcher & HCI Consultant',
            company: 'TechInsights Lab',
            location: 'Sofia, Bulgaria',
            date: '2018-01 – 2020-05',
            bullets: [
              'Conducted mixed-methods studies on user interaction with conversational agents, shaping design recommendations for four AI prototypes.',
              'Created interview protocols that revealed hidden user needs, raising identified pain points 31%.',
              'Analyzed transcripts in Nvivo, generating thematic models that guided product roadmaps.',
              'Presented findings to engineering and product teams, turning qualitative insights into actionable UI changes.',
              'Co-created a contextual scenario library used in usability testing for three multinational projects.',
              'Managed project timelines and deliverables, meeting milestones 10% ahead of schedule.',
            ],
          },
        ],
        education: [
          {
            id: 'd1',
            degree: 'Master of Social Work (MSW) – Licensed Clinical Social Worker (LCSW)',
            institution: 'University of Sofia – Faculty of Social Sciences',
            location: 'Sofia, Bulgaria',
            date: '2015-09 – 2018-06',
            details:
              'Thesis: "Contextual Factors in Client Engagement: A Qualitative Study of Social Work Practice", GPA 3.9/4.0.',
          },
          {
            id: 'd2',
            degree: 'Bachelor of Arts in Psychology',
            institution: 'University of Sofia – Faculty of Philosophy',
            location: 'Sofia, Bulgaria',
            date: '2011-09 – 2015-06',
            details: 'Thesis: "Self-Efficacy and Help-Seeking Behaviour", GPA 3.7/4.0.',
          },
        ],
        skills: [
          { id: 's1', category: 'Clinical Practice', items: ['Licensed Clinical Social Worker (LCSW)', 'Client intake & assessment', 'Context elicitation techniques', 'Crisis intervention', 'Resource navigation', 'Multidisciplinary case coordination'] },
          { id: 's2', category: 'Qualitative Research', items: ['Interview protocol design', 'Thematic analysis', 'NVivo & ATLAS.ti coding', 'Case review synthesis', 'Structured feedback generation', 'Mixed-methods reporting'] },
          { id: 's3', category: 'Human-AI Interaction', items: ['Evaluation pilot design', 'Language model alignment assessment', 'Social context scenario creation', 'Relevance & personalization metrics', 'Feedback loop documentation', 'User-centric AI testing'] },
          { id: 's4', category: 'Data Analysis & Project Management', items: ['Statistical significance testing', 'Inter-rater reliability calculation', 'Timeline & milestone tracking', 'Agile sprint coordination', 'Stakeholder communication', 'Process optimization'] },
          { id: 's5', category: 'Communication & Coaching', items: ['Active listening', 'Motivational interviewing', 'Cross-cultural counseling', 'Professional writing & documentation', 'Team facilitation', 'Training & mentorship'] },
        ],
        projects: [
          {
            id: 'p1',
            title: 'AI Contextual Alignment Pilot',
            subtitle: 'Turing AI Labs – Human-AI Interaction Evaluation',
            date: '2023-09 to Present',
            description:
              'Designed and ran a short-term pilot to test if providing social context before user requests improves language model recommendations. Created realistic social scenarios, carried out systematic evaluations, and delivered detailed feedback that guided model fine-tuning.',
          },
          {
            id: 'p2',
            title: 'Resource-Mapping Platform for Underserved Communities',
            subtitle: 'Global Health Services',
            date: '2021-03 to 2022-11',
            description:
              'Built a web-based tool that matched client needs with local financial, educational and health resources, cutting referral time 35% and raising service uptake 28%.',
          },
        ],
        certifications: [
          { id: 'c1', title: 'Licensed Clinical Social Worker (LCSW)', subtitle: 'Bulgarian Ministry of Health', date: '2019-07', description: 'State-licensed professional credential permitting independent clinical practice.' },
          { id: 'c2', title: 'Certified Qualitative Researcher (CQR)', subtitle: 'International Institute for Qualitative Methods', date: '2020-11', description: 'Validated expertise in designing, coding, and interpreting qualitative data.' },
        ],
        awards: [
          { id: 'a1', title: 'Outstanding Service Award', subtitle: 'Global Health Services', date: '2022-12', description: 'Recognized for exceptional client outcomes and an innovative resource-mapping initiative.' },
        ],
        languages: [
          { id: 'l1', name: 'English', level: 'Fluent' },
          { id: 'l2', name: 'Bulgarian', level: 'Native' },
          { id: 'l3', name: 'Spanish', level: 'Intermediate' },
        ],
        volunteer: [
          { id: 'v1', title: 'Community Mental Health Volunteer', subtitle: 'Sofia Open Care Initiative', date: '2018-04 to 2020-12', description: 'Provided pro-bono counseling sessions and led group workshops on stress management for underserved populations.' },
        ],
        references: [
          { id: 'r1', title: 'Dr. Elena Markov', subtitle: 'Director, Global Health Services', description: 'Available upon request.' },
        ],
      }

      /* ---------------------- block list (shared.tsx pipeline) --------------------- */
      // ?stress=1 pads the splittable paragraphs so they MUST break across pages,
      // exercising the split path the plain reproduction never reaches.
      if (new URLSearchParams(location.search).has('stress')) {
        const filler =
          ' She also contributes to internal quality reviews, mentors junior colleagues, ' +
          'and maintains documentation standards across concurrent engagements. '
        DATA.summary += filler.repeat(4)
        DATA.projects[0].description += filler.repeat(3)
        DATA.education[0].details += filler.repeat(2)
        DATA.experience[0].bullets[1] += filler.repeat(2)
        // a second, much longer paragraph so splitting is unavoidable
        DATA.awards[0].description += filler.repeat(80)
      }

      const blocks = []
      const push = (id, kind, node, extra = {}) => blocks.push({ id, kind, node, ...extra })
      const headingBlock = (key, label) =>
        push(`heading-${key}`, 'heading', headingNode(label.toUpperCase()), { splittable: false })
      const spacer = (id, height) => push(`spacer-${id}`, 'spacer', spacerNode(height))
      const paragraphBlock = (id, text) => {
        const clean = (text ?? '').replace(/\s*\n+\s*/g, ' ').trim()
        if (!clean) return
        push(`para-${id}`, 'paragraph', para({ ...PARAGRAPH, margin: '0 0 6px' }, clean), {
          text: clean,
          splittable: true,
          renderText: (slice) => para({ ...PARAGRAPH, margin: '0 0 6px' }, slice),
        })
      }

      push('header', 'header', headerNode())

      headingBlock('summary', 'Profile')
      paragraphBlock('summary', DATA.summary)

      headingBlock('experience', 'Experience')
      for (const item of DATA.experience) {
        push('exp-' + item.id, 'entry', entryNode(entryParts(item.role, joined([item.company, item.location]), item.date)))
        item.bullets.forEach((b, i) => push(`exp-${item.id}-b${i}`, 'bullet', bulletNode(b)))
        spacer(`exp-${item.id}`, ENTRY_BOTTOM)
      }

      headingBlock('education', 'Education')
      for (const item of DATA.education) {
        push('edu-' + item.id, 'entry', entryNode(entryParts(item.degree, joined([item.institution, item.location]), item.date)))
        paragraphBlock(`edu-details-${item.id}`, item.details)
        spacer(`edu-${item.id}`, ENTRY_BOTTOM)
      }

      headingBlock('skills', 'Skills')
      for (const group of DATA.skills) {
        push(`skill-${group.id}`, 'badges', badgesNode(group.category, group.items))
        spacer(`skill-${group.id}`, ITEM_BOTTOM)
      }

      // modern.tsx order: projects, certifications, awards, languages, volunteer, references
      const listed = ['projects', 'certifications', 'awards']
      const labels = { projects: 'Projects', certifications: 'Certifications', awards: 'Awards' }
      for (const key of listed) {
        headingBlock(key, labels[key])
        for (const item of DATA[key]) {
          push(`${key}-${item.id}`, 'entry', simpleEntryNode(entryParts(item.title, item.subtitle, item.date)))
          paragraphBlock(`${key}-desc-${item.id}`, item.description)
          spacer(`${key}-${item.id}`, ITEM_BOTTOM)
        }
      }

      headingBlock('languages', 'Languages')
      for (const item of DATA.languages) push(`lang-${item.id}`, 'line', languageNode(item.name, item.level))
      spacer('languages', ENTRY_BOTTOM)

      for (const key of ['volunteer', 'references']) {
        const text = key === 'volunteer' ? 'Volunteer Experience' : 'References'
        headingBlock(key, text)
        for (const item of DATA[key]) {
          push(`${key}-${item.id}`, 'entry', simpleEntryNode(entryParts(item.title, item.subtitle, item.date)))
          paragraphBlock(`${key}-desc-${item.id}`, item.description)
          spacer(`${key}-${item.id}`, ITEM_BOTTOM)
        }
      }

      /* ---------------------------- measure, then paginate ---------------------------- */
      const stage = document.getElementById('stage')
      stage.style.width = CONTENT_W + 'px'
      stage.style.fontFamily = SANS
      stage.style.color = BODY
      stage.style.fontSize = '13px'
      stage.style.lineHeight = '1.55'

      const holders = new Map()
      for (const b of blocks) {
        const holder = document.createElement('div')
        holder.className = 'cv-flow'
        holder.appendChild(b.node)
        stage.appendChild(holder)
        holders.set(b.id, holder)
      }

      const heights = {}
      const lineHeights = {}
      for (const b of blocks) {
        const holder = holders.get(b.id)
        heights[b.id] = holder.getBoundingClientRect().height
        const computed = getComputedStyle(holder)
        const lh = parseFloat(computed.lineHeight)
        const size = parseFloat(computed.fontSize) || 14
        lineHeights[b.id] = Number.isFinite(lh) && lh > 0 ? lh : size * 1.4
      }

      const measureText = (blockId, text) => {
        const holder = holders.get(blockId)
        if (!holder) return 0
        const target = holder.querySelector('[data-cv-text]')
        if (!target) return holder.getBoundingClientRect().height
        const original = target.textContent
        target.textContent = text
        const h = holder.getBoundingClientRect().height
        target.textContent = original
        return h
      }

      const plans = paginate(blocks, { contentHeight: CONTENT_H, heights, lineHeights, measureText, minLines: 2 })

      /* --- CRITICAL: replay each page into a real A4 box and measure the overflow --- */
      // Mirrors cv-document.tsx exactly: same width, padding and content style.
      const box = document.createElement('div')
      box.style.cssText = [
        'width:' + PAGE_W + 'px',
        'height:' + PAGE_H + 'px',
        'box-sizing:border-box',
        'overflow:hidden',
        'position:fixed',
        'top:0',
        'left:0',
        'background:#fff',
        'font-family:' + SANS,
        'color:' + BODY,
        'font-size:13px',
        'line-height:1.55',
        'padding:' + PAD.top + 'px ' + PAD.right + 'px ' + PAD.bottom + 'px ' + PAD.left + 'px',
      ].join(';')
      document.body.appendChild(box)

      const round = (n) => Math.round(n * 100) / 100

      // Text integrity: re-assembling every placed slice must reproduce the
      // source paragraph exactly. A lost or duplicated clause in a CV is far
      // worse than a bad page break.
      const integrity = []
      {
        const seen = new Map()
        for (const page of plans) {
          for (const placed of page.blocks) {
            if (placed.text === undefined) continue
            const list = seen.get(placed.block.id) ?? []
            list.push(placed.text)
            seen.set(placed.block.id, list)
          }
        }
        for (const block of blocks) {
          if (!block.splittable || !block.text) continue
          const slices = seen.get(block.id) ?? []
          const rebuilt = slices.join(' ')
          const same = rebuilt.replace(/\s+/g, ' ').trim() === block.text.replace(/\s+/g, ' ').trim()
          integrity.push({
            id: block.id,
            sourceChars: block.text.length,
            sliceChars: rebuilt.length,
            slices: slices.map((s) => s.length),
            intact: same,
          })
        }
      }

      const audit = plans.map((page, i) => {
        box.innerHTML = ''
        const diffs = []
        for (const placed of page.blocks) {
          const wrap = document.createElement('div')
          wrap.className = 'cv-flow'
          wrap.appendChild(
            placed.text !== undefined && placed.block.renderText
              ? placed.block.renderText(placed.text)
              : placed.block.node,
          )
          box.appendChild(wrap)
          const actual = wrap.getBoundingClientRect().height
          // What the engine believed it was spending, vs what the box really took.
          const reserved = placed.height
          if (Math.abs(actual - reserved) > 0.5) {
            diffs.push({
              id: placed.block.id + (placed.text !== undefined ? '[slice]' : ''),
              kind: placed.block.kind,
              reserved: round(reserved),
              actual: round(actual),
              delta: round(actual - reserved),
            })
          }
        }
        const contentTop = box.getBoundingClientRect().top + PAD.top
        const limit = box.getBoundingClientRect().bottom - PAD.bottom
        const last = box.lastElementChild
        const lastBottom = last ? last.getBoundingClientRect().bottom : contentTop
        return {
          page: i + 1,
          plannedUsed: round(page.used),
          actualStackedHeight: round(
            Array.from(box.children).reduce((sum, c) => sum + c.getBoundingClientRect().height, 0),
          ),
          contentHeight: CONTENT_H,
          bottomOfLastBlock: round(lastBottom - contentTop),
          freeAtBottom: round(limit - lastBottom),
          heightMismatches: diffs,
        }
      })
      box.remove()

      const pages = plans.map((page, index) => ({
        page: index + 1,
        used: round(page.used),
        free: round(CONTENT_H - page.used),
        fill: round((page.used / CONTENT_H) * 1000) / 10,
        first: page.blocks[0]?.block.id ?? null,
        last: page.blocks[page.blocks.length - 1]?.block.id ?? null,
        blocks: page.blocks.map((p) => p.block.id + (p.text !== undefined ? '[' + p.text.length + 'ch]' : '')),
      }))

      document.getElementById('report').textContent = JSON.stringify(
        { contentWidth: CONTENT_W, contentHeight: CONTENT_H, pageCount: pages.length, integrity, audit, pages },
        null,
        1,
      )
    </script>
  </body>
</html>
